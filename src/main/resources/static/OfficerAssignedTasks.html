<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CivicPulse - Officer Assigned Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/officer-pages.css">
</head>
<body data-page="assigned">
  <div class="app">
    <nav class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon-sm">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        </div>
        <span class="logo-text-sm">CivicPulse</span>
      </div>
      <div class="sidebar-role">
        <div class="role-dot"></div>
        <div>
          <div class="role-name-display" id="sidebarRole">OFFICER</div>
          <div class="role-username" id="sidebarUsername">@officer</div>
        </div>
      </div>
      <div id="navItems"></div>
      <div class="sidebar-footer">
        <button class="logout-btn" onclick="logout()">Sign Out</button>
      </div>
    </nav>
    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <h1 id="topbarTitle">Assigned Tasks</h1>
          <p id="topbarDate"></p>
        </div>
        <div class="avatar" id="userAvatar">O</div>
      </div>
      <main class="content" id="pageContent"></main>
    </div>
  </div>
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Task Details</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/officer-common.js"></script>
</body>
</html>
