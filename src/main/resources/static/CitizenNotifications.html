<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CivicPulse - Notifications</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #0d1117;
      --ink-soft: #4b5563;
      --surface: #f3f5f9;
      --panel: #ffffff;
      --accent: #1a56db;
      --border: #e5e8f0;
      --citizen: #0ea5e9;
      --sidebar-w: 260px;
    }
    html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--ink); }
    .app { min-height: 100vh; width: 100%; }
    .sidebar { background: var(--ink); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh; overflow-y: auto; z-index: 100; }
    .sidebar-logo { padding: 24px 20px 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .logo-icon { width: 34px; height: 34px; background: var(--accent); border-radius: 9px; display: flex; align-items: center; justify-content: center; }
    .logo-icon svg { width: 18px; height: 18px; fill: white; }
    .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; color: white; }
    .sidebar-role { margin: 16px 16px 8px; padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; align-items: center; gap: 10px; }
    .role-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--citizen); }
    .role-name-display { font-family: 'Syne', sans-serif; font-size: 0.82rem; font-weight: 700; color: white; text-transform: uppercase; letter-spacing: 0.06em; }
    .role-username { font-size: 0.75rem; color: rgba(255,255,255,0.45); margin-top: 1px; }
    .nav-section { padding: 20px 12px 8px; }
    .nav-section-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.3); padding: 0 8px; margin-bottom: 6px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: rgba(255,255,255,0.55); font-size: 0.88rem; font-weight: 500; transition: background 0.15s, color 0.15s; margin-bottom: 2px; }
    .nav-item:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.9); }
    .nav-item.active { background: var(--citizen); color: white; }
    .nav-item svg { width: 18px; height: 18px; }
    .sidebar-footer { margin-top: auto; padding: 16px; border-top: 1px solid rgba(255,255,255,0.08); }
    .logout-btn { width: 100%; padding: 10px; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.2); border-radius: 10px; color: #f87171; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; cursor: pointer; }

    .main { margin-left: var(--sidebar-w); width: calc(100% - var(--sidebar-w)); min-height: 100vh; }
    .topbar { background: var(--panel); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .topbar h1 { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.25rem; }
    .topbar p { font-size: 0.82rem; color: var(--ink-soft); margin-top: 1px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--citizen); color: white; display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 0.9rem; }

    .content { padding: 24px 32px 32px; width: 100%; }
    .timeline { display: grid; gap: 12px; }
    .notice { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
    .notice-title { font-weight: 700; font-size: 0.92rem; }
    .notice-meta { color: var(--ink-soft); font-size: 0.8rem; margin-top: 4px; }
    .empty { background: var(--panel); border: 1px dashed var(--border); border-radius: 14px; padding: 24px; color: var(--ink-soft); }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; width: 100%; }
      .content { padding: 20px; }
    }
  </style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>
      <span class="logo-text">CivicPulse</span>
    </div>
    <div class="sidebar-role">
      <div class="role-dot"></div>
      <div>
        <div class="role-name-display">CITIZEN</div>
        <div class="role-username" id="sidebarUsername">@user</div>
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">Main</div>
      <a class="nav-item" href="Dashboard.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Overview</a>
      <a class="nav-item" href="Submit.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>Submit Grievance</a>
      <a class="nav-item" href="MyGrievances.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>My Grievances</a>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">Account</div>
      <a class="nav-item" href="CitizenProfile.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>My Profile</a>
      <a class="nav-item active" href="CitizenNotifications.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm6-6V11a6 6 0 1 0-12 0v5l-2 2v1h16v-1l-2-2z"/></svg>Notifications</a>
    </div>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()">⬡ Sign Out</button>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <div>
        <h1>Notifications</h1>
        <p id="topbarDate"></p>
      </div>
      <div class="avatar" id="userAvatar">C</div>
    </div>

    <div class="content">
      <div class="timeline" id="timeline">
        <div class="empty">Loading notifications…</div>
      </div>
    </div>
  </div>
</div>

<script>
  const token = localStorage.getItem('civicpulse_token');
  const userStr = localStorage.getItem('civicpulse_user');
  if (!token || !userStr) window.location.href = '/index.html';

  const user = JSON.parse(userStr);
  if (user.role !== 'CITIZEN') {
    window.location.href = '/Dashboard.html';
  }

  document.getElementById('sidebarUsername').textContent = '@' + user.username;
  document.getElementById('userAvatar').textContent = user.username[0].toUpperCase();
  document.getElementById('topbarDate').textContent = new Date().toLocaleDateString('en-IN', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  function prettyStatus(status) {
    return String(status || '').replace(/_/g, ' ');
  }

  function prettyDate(value) {
    return new Date(value).toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  async function loadNotifications() {
    const timeline = document.getElementById('timeline');
    try {
      const res = await fetch('/api/grievances/my', { headers: { Authorization: 'Bearer ' + token } });
      if (!res.ok) throw new Error('Failed');
      const list = await res.json();

      // Only keep records where status was updated after submission.
      const sorted = list
        .filter(g => g.updatedAt && g.submittedAt && Math.abs(new Date(g.updatedAt) - new Date(g.submittedAt)) > 1000)
        .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))
        .slice(0, 20);

      if (!sorted.length) {
        timeline.innerHTML = '<div class="empty">No status-change notifications yet. You will see updates here when grievance status changes.</div>';
        return;
      }

      timeline.innerHTML = sorted.map(g => {
        const when = g.updatedAt;
        return `
          <article class="notice">
            <div class="notice-title">#${g.id} ${g.title}</div>
            <div class="notice-meta">Status changed to ${prettyStatus(g.status)} • ${prettyDate(when)}</div>
          </article>
        `;
      }).join('');
    } catch {
      timeline.innerHTML = '<div class="empty">Could not load notifications right now.</div>';
    }
  }

  function logout() {
    localStorage.removeItem('civicpulse_token');
    localStorage.removeItem('civicpulse_user');
    window.location.href = '/index.html';
  }

  loadNotifications();
</script>
</body>
</html>
