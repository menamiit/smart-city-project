spring.application.name=smart-city-project

# H2 database (file-based for persistence across restarts)
spring.datasource.url=jdbc:h2:file:${user.home}/smart-city-db/smartcity;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Analytics SLA defaults (hours)
analytics.sla.default-hours=72

# Matrix format: CATEGORY:PRIORITY=hours, CATEGORY:* = fallback for category, *:PRIORITY = fallback for priority
analytics.sla.matrix=WATER:CRITICAL=12,WATER:HIGH=24,WATER:MEDIUM=48,WATER:LOW=72,ROAD:CRITICAL=24,ROAD:HIGH=48,ROAD:MEDIUM=96,ROAD:LOW=120,SANITATION:*=48,ELECTRICITY:*=36,*:CRITICAL=24,*:HIGH=48,*:MEDIUM=72,*:LOW=120
